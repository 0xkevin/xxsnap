name: snipory
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  snipory:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      - Resources/Snipory.png
      - Resources/Snipory.icns
      - Resources/Icons/pin-to-screen.svg
      - Resources/Icons/copy-to-clipboard.svg
      - Resources/Icons/save-to-file.svg
      - Resources/Icons/refresh-svgrepo-com.svg
      - Resources/Icons/refresh-svgrepo-com2.svg
      - Resources/Icons/refresh-left-svgrepo-com.svg
      - Resources/Icons/refresh (1).svg
      - Resources/Icons/refresh-svgrepo-com3.svg
      - Resources/Icons/eyedropper.svg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snipory.v2.mac
        PRODUCT_NAME: Snipory
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Snipory
        INFOPLIST_KEY_CFBundleName: Snipory
        INFOPLIST_KEY_CFBundleIconFile: Snipory
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/SniporyMac-Bridging-Header.h
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Snipory Local Dev"
  sniporyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: snipory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snipory.v2.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snipory.app/Contents/MacOS/Snipory"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  snipory:
    build:
      targets:
        snipory: all
        sniporyTests: [test]
    test:
      targets:
        - name: sniporyTests
