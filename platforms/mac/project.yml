name: xxsnap
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/../../core/include"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 10
    MARKETING_VERSION: 1.3.1
targets:
  xxsnap:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: ../../core/src/scroll/FrameFingerprint.cpp
        group: Core/Scroll
      - path: ../../core/src/scroll/VerticalOverlapMatcher.cpp
        group: Core/Scroll
        compilerFlags: "-O2"
      - path: ../../core/src/scroll/ScrollStitchSession.cpp
        group: Core/Scroll
        compilerFlags: "-O2"
      - path: Resources/Info.plist
        buildPhase: none
      - Resources/Assets.xcassets
      - Resources/xxsnap.png
      - Resources/xxsnap.icns
      - path: Resources/Commercial
      - path: Resources/Help
        type: folder
        buildPhase: resources
      - path: Resources/Donation
      - path: Resources/Sounds
      - path: Resources/Icons
        excludes:
          - xxsnap.png
          - xxsnap.icns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xxsnap.mac
        PRODUCT_NAME: XxSnap
        PRODUCT_MODULE_NAME: xxsnap
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/xxsnap-Bridging-Header.h
        XX_COMMERCIAL_RELEASE_PHASE: free
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "xxsnap Local Dev"
        OTHER_LDFLAGS: "$(inherited) -lz"
      configs:
        Debug:
          XX_COMMERCIAL_SIGNING_PUBLIC_KEY_2025_01: "11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo="
          XX_COMMERCIAL_SIGNING_PUBLIC_KEY_2026_01: "iojj3XQJ8ZX9UtstPLpdcspnCb8dlBIb83SIAbQPb1w="
        Release:
          XX_COMMERCIAL_SIGNING_PUBLIC_KEY_2025_01: "$(XX_COMMERCIAL_PRODUCTION_SIGNING_PUBLIC_KEY_2025_01)"
          XX_COMMERCIAL_SIGNING_PUBLIC_KEY_2026_01: "$(XX_COMMERCIAL_PRODUCTION_SIGNING_PUBLIC_KEY_2026_01)"
    postBuildScripts:
      - name: Validate Commercial Release Inputs
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Release" ]; then
            exit 0
          fi
          BUILT_INFO="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          BOOTSTRAP="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/commercial-policy-bootstrap.json"
          if [ ! -f "$BUILT_INFO" ] || [ ! -f "$BOOTSTRAP" ]; then
            echo "error: Release commercial policy bootstrap is missing"
            exit 1
          fi
          /usr/bin/xcrun --sdk macosx swift - "$BUILT_INFO" "$BOOTSTRAP" <<'SWIFT'
          import CryptoKit
          import Foundation

          func fail(_ message: String) -> Never {
              FileHandle.standardError.write(Data("error: \(message)\n".utf8))
              exit(1)
          }

          func canonicalBase64(_ value: Any?, field: String) -> Data {
              guard let value = value as? String,
                    let data = Data(base64Encoded: value),
                    data.base64EncodedString() == value else {
                  fail("Release commercial \(field) is not canonical Base64")
              }
              return data
          }

          func utcDate(_ value: Any?, field: String) -> Date {
              guard let value = value as? String, value.hasSuffix("Z") else {
                  fail("Release commercial \(field) is not a UTC ISO8601 date")
              }
              let formatter = ISO8601DateFormatter()
              formatter.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
              if let date = formatter.date(from: value) { return date }
              formatter.formatOptions = [.withInternetDateTime]
              guard let date = formatter.date(from: value) else {
                  fail("Release commercial \(field) is not a UTC ISO8601 date")
              }
              return date
          }

          let arguments = CommandLine.arguments
          guard arguments.count == 3 else { fail("Release commercial validation arguments are missing") }
          let infoData = try Data(contentsOf: URL(fileURLWithPath: arguments[1]))
          let envelopeData = try Data(contentsOf: URL(fileURLWithPath: arguments[2]))
          guard let info = try PropertyListSerialization.propertyList(from: infoData, format: nil) as? [String: Any],
                let releasePhase = info["XXCommercialReleasePhase"] as? String,
                ["free", "paid"].contains(releasePhase),
                let publicKeys = info["XXCommercialSigningPublicKeys"] as? [String: String] else {
            fail("Release commercial phase or signing public-key dictionary is missing or invalid")
          }
          let debugKeys = Set([
              "11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=",
              "iojj3XQJ8ZX9UtstPLpdcspnCb8dlBIb83SIAbQPb1w=",
          ])
          var validatedPublicKeys: [String: Data] = [:]
          for (keyId, encodedPublicKey) in publicKeys {
              if encodedPublicKey.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                  continue
              }
              let publicKeyData = canonicalBase64(encodedPublicKey, field: "public key")
              guard publicKeyData.count == 32 else {
                  fail("Release commercial public key must be 32 bytes")
              }
              guard !debugKeys.contains(encodedPublicKey) else {
                  fail("Release cannot use a Debug/test commercial signing public key")
              }
              validatedPublicKeys[keyId] = publicKeyData
          }
          guard !validatedPublicKeys.isEmpty else {
              fail("Release commercial signing public-key dictionary has no configured keys")
          }
          guard let envelope = try JSONSerialization.jsonObject(with: envelopeData) as? [String: Any],
                Set(envelope.keys) == Set(["keyId", "payload", "signature"]),
                let keyId = envelope["keyId"] as? String,
                !keyId.isEmpty,
                keyId.count <= 128,
                let publicKeyData = validatedPublicKeys[keyId] else {
              fail("Release commercial envelope is malformed or its keyId has no public key")
          }
          let payload = canonicalBase64(envelope["payload"], field: "payload")
          let signature = canonicalBase64(envelope["signature"], field: "signature")
          guard signature.count == 64,
                let publicKey = try? Curve25519.Signing.PublicKey(rawRepresentation: publicKeyData),
                publicKey.isValidSignature(signature, for: payload) else {
              fail("Release commercial bootstrap signature verification failed")
          }
          guard let policy = try JSONSerialization.jsonObject(with: payload) as? [String: Any],
                policy["schemaVersion"] as? Int == 1,
                let policyMode = policy["mode"] as? String,
                let billingReady = policy["billingReady"] as? Bool else {
            fail("Release commercial bootstrap payload is malformed")
          }
          if releasePhase == "free" {
            guard policyMode == "all_free", billingReady == false else {
              fail("Free release requires an all_free bootstrap with billing disabled")
            }
          } else {
            guard policyMode == "paid", billingReady == true else {
              fail("Paid release requires a paid bootstrap with billing enabled")
            }
          }
          let effectiveAt = utcDate(policy["effectiveAt"], field: "effectiveAt")
          let expiresAt = utcDate(policy["expiresAt"], field: "expiresAt")
          let buildDate = Date()
          guard effectiveAt < expiresAt,
                expiresAt.timeIntervalSince(effectiveAt) <= 30 * 24 * 60 * 60 else {
              fail("Release commercial bootstrap window exceeds 30 days")
          }
          guard effectiveAt <= buildDate else {
              fail("Release commercial bootstrap is not effective at build time")
          }
          guard buildDate.addingTimeInterval(14 * 24 * 60 * 60) < expiresAt else {
              fail("Release commercial bootstrap has less than 14 days of validity")
          }
          guard expiresAt <= buildDate.addingTimeInterval(30 * 24 * 60 * 60) else {
              fail("Release commercial bootstrap expires more than 30 days after build time")
          }
          SWIFT
  xxsnapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Resources/Help
        type: folder
        buildPhase: resources
    dependencies:
      - target: xxsnap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xxsnap.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XxSnap.app/Contents/MacOS/XxSnap"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  xxsnap:
    build:
      targets:
        xxsnap: all
        xxsnapTests: [test]
    test:
      targets:
        - name: xxsnapTests
