name: 问题报告 / Bug report
description: 报告可以稳定复现的 XxSnap 问题 / Report a reproducible XxSnap problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈。提交前请搜索现有 Issues，并确保内容中不包含密码、密钥或私人信息。

        Thank you for your report. Search existing issues first and remove all sensitive information before submitting.

  - type: input
    id: app-version
    attributes:
      label: XxSnap 版本 / XxSnap version
      description: 可在“关于 XxSnap”中查看 / Find this in About XxSnap
      placeholder: "例如 / Example: 1.2.0 (120)"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本 / macOS version
      placeholder: "例如 / Example: macOS 15.6"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Mac 芯片 / Mac chip
      options:
        - Apple 芯片 / Apple silicon
        - Intel
        - 不确定 / Not sure
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: 相关功能 / Affected feature
      options:
        - 截图与标注 / Capture and annotation
        - 滚动截图 / Scrolling capture
        - 贴图 / Pinned images
        - 文字识别 / Text recognition
        - 教笔 / Presentation pen
        - 安装或更新 / Installation or update
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 请按发生顺序列出操作 / List the actions in order
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 补充材料 / Additional context
      description: 可拖入经过脱敏的截图、录屏或日志 / Attach redacted screenshots, recordings, or logs

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认 / Checklist
      options:
        - label: 我已经搜索过现有 Issues，没有发现相同问题。/ I searched existing issues and found no duplicate.
          required: true
        - label: 我已经移除所有敏感和私人信息。/ I removed all sensitive and private information.
          required: true
